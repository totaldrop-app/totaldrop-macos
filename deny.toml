# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# No advisory is ignored. An ignore needs a reason and the condition for
# removing it, and osv-scanner.toml (OpenSSF Scorecard) must list the same
# advisories; CI checks that the two agree (tools/check-advisory-ignores.sh).
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # curve25519-dalek, ed25519-dalek, subtle: permissive, GPL/AGPL compatible.
    "BSD-3-Clause",
    # ring, untrusted, rustls-webpki: permissive, GPL/AGPL compatible.
    "ISC",
    # webpki-roots (the Mozilla root list as data): permissive, compatible.
    "CDLA-Permissive-2.0",
]
# Add a license here only after checking that it is compatible with the
# repository licensing policy, and document the rationale in the pull request.
exceptions = [
    { allow = ["GPL-3.0-or-later"], crate = "totaldrop-macos-bridge" },
    { allow = ["GPL-3.0-or-later"], crate = "totaldrop-macos-ffi" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
