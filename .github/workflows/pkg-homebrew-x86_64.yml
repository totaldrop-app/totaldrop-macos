#
# Dedicated sub-platform x CPU cloud packaging & Sigstore provenance workflow
# for `macos-homebrew-x86_64` (`totaldrop-macos`, ADR 0020).
name: Package (homebrew / x86_64)

on:
  push:
    tags:
      - "macos-homebrew-x86_64-v*"
  pull_request:
    paths:
      - "subplatforms/homebrew/x86_64/**"
      - ".github/workflows/pkg-homebrew-x86_64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg-homebrew-x86_64-${{ github.ref }}
  cancel-in-progress: "${{ !startsWith(github.ref, 'refs/tags/') }}"

jobs:
  package:
    name: Build & Verify (homebrew / x86_64)
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate isolated sub-platform recipe (macos-homebrew-x86_64)
        shell: bash
        run: |
          sh subplatforms/homebrew/x86_64/build.sh --check-recipe
          sh subplatforms/homebrew/x86_64/verify.sh --check-recipe
      - name: Stage deterministic sub-platform artifact & SHA256SUMS
        shell: bash
        env:
          SOURCE_DATE_EPOCH: "1760000000"
        run: |
          stage_dir="$RUNNER_TEMP/stage-homebrew-x86_64"
          out_dir="$RUNNER_TEMP/dist-homebrew-x86_64"
          mkdir -p "$stage_dir" "$out_dir"
          printf 'unit=%s\nsha=%s\n' "macos-homebrew-x86_64" "$GITHUB_SHA" >"$stage_dir/SOURCE_COMMIT.txt"
          sh subplatforms/homebrew/x86_64/build.sh --package-staged "$stage_dir" "$out_dir"
          sh subplatforms/homebrew/x86_64/verify.sh "$out_dir"
      - name: Upload sub-platform artifact & SHA256SUMS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-homebrew-x86_64
          path: |
            ${{ runner.temp }}/dist-homebrew-x86_64/TotalDrop-0.3.0-beta.6-homebrew-x86_64.tar.gz
            ${{ runner.temp }}/dist-homebrew-x86_64/SHA256SUMS
          if-no-files-found: error
      - name: Attest Sigstore OIDC build provenance on release tags
        if: startsWith(github.ref, 'refs/tags/macos-homebrew-x86_64-v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist-homebrew-x86_64/TotalDrop-0.3.0-beta.6-homebrew-x86_64.tar.gz
